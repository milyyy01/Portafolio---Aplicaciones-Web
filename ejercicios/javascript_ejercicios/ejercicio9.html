<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Operaciones con bucle</title>
</head>
<body>
  <script type="text/javascript">
    var num1 = parseFloat(prompt("Introduce el primer número:"));
    var num2 = parseFloat(prompt("Introduce el segundo número:"));

    for (var i = 1; i <= 5; i++) {
      var resultado;
      var operacion;

      switch (i) {
        case 1:
          operacion = "SUMA";
          resultado = num1 + num2;
          break;
        case 2:
          operacion = "RESTA";
          resultado = num1 - num2;
          break;
        case 3:
          operacion = "MULTIPLICACIÓN";
          resultado = num1 * num2;
          break;
        case 4:
          operacion = "DIVISIÓN";
          resultado = num1 / num2;
          break;
        case 5:
          operacion = "MÓDULO";
          resultado = num1 % num2;
          break;
      }

      alert("Iteración " + i + " - " + operacion + ": " + resultado);
    }
  </script>
</body>
</html>
