<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGRU - Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="pantalla">

    <header class="portada">
      <a href="#" class="volver" id="enlaceVolver">&larr; Volver al inicio</a>
      <div class="logo">
        <svg class="logo-icono" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="20" cy="16" r="6" fill="currentColor"/>
          <path d="M8 32c2-7 8-9 12-9s10 2 12 9" fill="currentColor"/>
        </svg>
        <span class="logo-texto">Uleam</span>
      </div>
      <h1>SGRU</h1>
      <h2>SISTEMA DE GESTIÓN DE RESIDENCIA UNIVERSITARIA</h2>
    </header>

    <main class="contenido">
      <h3>Iniciar sesión</h3>
      <p class="descripcion">Accede a SGRU para gestionar tu solicitud y tu residencia universitaria.</p>

      <form id="formularioLogin" novalidate>
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" placeholder="Ingresa tu correo institucional" autocomplete="username">
        <small class="error" id="errorCorreo"></small>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" autocomplete="current-password">
        <small class="error" id="errorContrasena"></small>

        <label class="mostrar">
          <input type="checkbox" id="mostrarContrasena"> Mostrar contraseña
        </label>

        <button type="submit" class="boton-principal">Iniciar sesión</button>
      </form>

      <a href="#" class="olvido" id="enlaceOlvido">¿Olvidaste tu contraseña?</a>
    </main>

    <footer class="pie-pagina"></footer>
  </div>

  <script src="login.js"></script>
</body>
</html>
